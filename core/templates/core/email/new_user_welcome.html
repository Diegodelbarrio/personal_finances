<!doctype html>
<html lang="en">
<body style="margin:0; padding:0; background:#f6f8fb; font-family:Inter, Arial, sans-serif; color:#17202c;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8fb; padding:24px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:#ffffff; border:1px solid #dbe3ee; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="padding:24px; border-bottom:1px solid #edf1f6;">
              <div style="font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#0d6efd;">FinOrbit</div>
              <h1 style="margin:8px 0 0; font-size:24px; line-height:1.2; color:#17202c;">Welcome, {{ username }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <p style="margin:0 0 14px; color:#344054; font-size:15px; line-height:1.55;">Your account has been created successfully.</p>
              <p style="margin:0 0 22px; color:#657386; font-size:14px; line-height:1.55;">You can now sign in and start using your personal finance workspace.</p>
              <a href="{{ login_url }}" style="display:inline-block; background:#0d6efd; color:#ffffff; text-decoration:none; font-size:14px; font-weight:700; padding:11px 14px; border-radius:8px;">Open FinOrbit</a>
              <p style="margin:22px 0 0; color:#98a2b3; font-size:12px; line-height:1.5;">If you did not create this account, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
