<!doctype html>
<html lang="en">
<body style="margin:0; padding:0; background:#f6f8fb; font-family:Inter, Arial, sans-serif; color:#17202c;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f8fb; padding:24px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px; background:#ffffff; border:1px solid #dbe3ee; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="padding:22px 24px; border-bottom:1px solid #edf1f6;">
              <div style="font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#0d6efd;">FinOrbit alert</div>
              <h1 style="margin:8px 0 0; font-size:22px; line-height:1.2; color:#17202c;">New user registered</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 24px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
                <tr>
                  <td style="padding:10px 0; color:#657386; font-size:13px; font-weight:700;">Username</td>
                  <td style="padding:10px 0; color:#17202c; font-size:14px; font-weight:700; text-align:right;">{{ username }}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0; color:#657386; font-size:13px; font-weight:700; border-top:1px solid #edf1f6;">Email</td>
                  <td style="padding:10px 0; color:#17202c; font-size:14px; font-weight:700; text-align:right; border-top:1px solid #edf1f6;">{{ email }}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0; color:#657386; font-size:13px; font-weight:700; border-top:1px solid #edf1f6;">Full name</td>
                  <td style="padding:10px 0; color:#17202c; font-size:14px; font-weight:700; text-align:right; border-top:1px solid #edf1f6;">{{ full_name }}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0; color:#657386; font-size:13px; font-weight:700; border-top:1px solid #edf1f6;">Joined at</td>
                  <td style="padding:10px 0; color:#17202c; font-size:14px; font-weight:700; text-align:right; border-top:1px solid #edf1f6;">{{ joined_at|date:"Y-m-d H:i T" }}</td>
                </tr>
              </table>

              <div style="margin-top:22px;">
                <a href="{{ admin_user_url }}" style="display:inline-block; background:#0d6efd; color:#ffffff; text-decoration:none; font-size:14px; font-weight:700; padding:11px 14px; border-radius:8px;">Open user in admin</a>
                <a href="{{ login_url }}" style="display:inline-block; margin-left:8px; color:#0d6efd; text-decoration:none; font-size:14px; font-weight:700;">Open FinOrbit</a>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
