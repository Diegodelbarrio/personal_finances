[tool.ruff]
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
# Start with correctness errors only; broader style cleanup can be introduced
# separately without mixing it with product changes.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
fail_under = 72
precision = 1
show_missing = true
skip_covered = true
