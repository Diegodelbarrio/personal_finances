<svg width="550" height="150" viewBox="0 0 550 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="550" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="550" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7D7FF"/>
    </linearGradient>

    <radialGradient id="satGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#6ED3FF"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <style>
      .logo-type {
        font-family: 'Montserrat','Inter','Segoe UI',sans-serif;
        font-weight: 900;
        font-size: 90px;
        letter-spacing: -2.5px;
      }
      .mark {
        font-family: 'Montserrat','Inter','Segoe UI',sans-serif;
        font-weight: 900;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="18"/>

  <g transform="translate(45, 106)">
    <text x="0" y="0" class="logo-type" fill="url(#textGrad)">Fin</text>

    <!-- Orbit "O" -->
    <g>
      <circle cx="186" cy="-32" r="40" fill="none" stroke="url(#textGrad)" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="195 60" transform="rotate(-35 186 -32)"/>
      <circle cx="186" cy="-32" r="34" fill="none" stroke="url(#textGrad)" stroke-width="2.5" opacity="0.35"
              stroke-linecap="round" stroke-dasharray="160 90" transform="rotate(145 186 -32)"/>
    </g>

    <!-- Satellite badge -->
    <g filter="url(#shadow)">
      <circle cx="220" cy="-58" r="18" fill="url(#satGrad)"/>
      <circle cx="220" cy="-58" r="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1"/>
      <text x="220" y="-50" class="mark" font-size="22" fill="#0B1220" text-anchor="middle">$</text>
    </g>

    <text x="244" y="0" class="logo-type" fill="url(#textGrad)">rbit</text>
  </g>
</svg>
